name: showtime
description: "Open-source screen recorder for polished developer demos."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  bloc: ^9.2.2
  clock: ^1.1.3
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.2
  material_ui: ^1.1.0
  path: ^1.9.1
  recording_repository:
    path: packages/recording_repository
  screen_capture_client:
    path: packages/screen_capture_client

dev_dependencies:
  bloc_test: ^10.0.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:

  uses-material-design: true
